<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="도서관으로부터의 초대">
  <meta property="og:description" content="당신에게 한 장의 초대장이 도착했습니다.">
  <meta property="og:type" content="website">

  <title>도서관으로부터의 초대</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 처음 사이트에 들어왔을 때 나타나는 화면 -->
<div id="entranceScreen" class="entrance-screen">

  <div class="entrance-content">

    <p class="entrance-small">
      THE LIBRARY
    </p>

    <h1>
      한 장의 초대장이<br>
      도착했습니다.
    </h1>

    <p class="entrance-description">
      이곳에 들어가려면<br>
      초대장을 열어야 합니다.
    </p>

    <button id="openInvitationButton" class="open-button">
      초대장 열기
    </button>

  </div>

</div>


<!-- 실제 초대장 -->
<main id="invitation" class="invitation hidden">

  <div class="ornament top">
    ✦
  </div>


  <header class="header">

    <p class="eyebrow">
      AN INVITATION FROM
    </p>

    <h1>
      THE LIBRARY
    </h1>

    <p class="subtitle">
      당신을 도서관으로 초대합니다.
    </p>

  </header>


  <div class="divider">
    <span></span>
    ◆
    <span></span>
  </div>


  <section class="message">

    <p>
      오래된 책장 사이에서<br>
      당신을 위한 세 권의 책을 골랐습니다.
    </p>

    <p>
      그중 하나를 선택하십시오.
    </p>

  </section>


  <!-- 랜덤 책 3권 -->
  <section class="books-section">

    <div class="section-title">
      <span></span>
      <h2>오늘의 책</h2>
      <span></span>
    </div>

    <div id="bookContainer" class="book-container">
      <!-- books.js / script.js에서 생성 -->
    </div>

  </section>


  <div class="divider">
    <span></span>
    ◆
    <span></span>
  </div>


  <!-- 수신인 -->
  <section class="recipient">

    <div class="recipient-heading">
      <span></span>

      <h2>
        수신인
      </h2>

      <span></span>
    </div>


    <label
            class="sr-only"
            for="recipientInput">
      수신인 서명
    </label>


    <div class="signature-area">

      <input
              id="recipientInput"
              class="recipient-input"
              type="text"
              maxlength="30"
              autocomplete="off"
              placeholder="여기에 서명하십시오"
      >

    </div>


    <p
            id="selectionText"
            class="selection-text">
      책을 선택하십시오.
    </p>

  </section>


  <!-- 초대장 버튼 -->
  <section class="invite-section">

    <button
            id="inviteButton"
            class="invite-button"
            disabled>

      초대장 받기

    </button>

  </section>


  <footer>

    <p>
      LIBRARY ARCHIVE
    </p>

    <p>
      ✦
    </p>

  </footer>


  <div class="ornament bottom">
    ✦
  </div>

</main>


<!-- YouTube 플레이어 -->
<div
        id="youtube-player"
        class="youtube-player">
</div>


<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script src="books.js"></script>
<script src="script.js"></script>

</body>
</html>
